<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="react-holo-card renders a pointer-reactive holographic card in React — tilt, glare, and rainbow foil, driven by CSS custom properties."
    />
    <title>holocard — pointer-reactive holographic cards for React</title>
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      const stored = localStorage.getItem('theme')
      const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
